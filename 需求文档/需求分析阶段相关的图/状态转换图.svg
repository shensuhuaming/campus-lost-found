<text font-size="14" text-anchor="middle" x="348" y="213">审核通过</text>
<text font-size="14" text-anchor="middle" x="515" y="79">审核驳回</text>
<text font-size="14" text-anchor="middle" x="560" y="235">发布者撤回</text>
