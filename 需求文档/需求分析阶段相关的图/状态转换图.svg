<text font-size="14" text-anchor="middle" x="720" y="553.33">do/标记已归还/已找回</text>
<text font-size="13" text-anchor="middle" x="455" y="654.6">注：状态框内 do/xxx 为状态内的活动；箭头上的文字为触发状态转换的事件。</text>
