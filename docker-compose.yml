# =====================================================================
# 校园失物招领系统 · 一键启动编排
#
# 端口规划（避开本机已占用的 3306 MySQL）：
#   前端  http://localhost        （nginx → 容器内 80）
#   后端  http://localhost:8080   （Spring Boot）
#   MySQL localhost:3307          （容器内 3306）
#
# 用法：
#   仅数据库：       docker compose up -d mysql
#   全栈部署/验收：   docker compose --profile full up -d --build
#   演示环境：       docker compose --profile full --env-file .env.demo up -d --build
#   停止：           docker compose --profile full down
#   重置数据库：     docker compose --profile full down -v   （会删除数据卷！）
# =====================================================================

# 项目名显式指定：目录名含中文，compose 从目录推导项目名会失败
name: clf

services:
  mysql:
    image: mysql:8.0
    container_name: clf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_lost_found}
      MYSQL_USER: ${MYSQL_USER:-clf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次创建数据卷时按文件名顺序执行，仅执行一次
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - clf-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clf-backend:${APP_VERSION:-0.1.0}
    container_name: clf-backend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # 容器内用服务名 mysql 访问，端口是 3306
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campus_lost_found}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-clf}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-in-production}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - clf-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: clf-frontend:${APP_VERSION:-0.1.0}
    container_name: clf-frontend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - clf-net

volumes:
  mysql-data:
    name: clf-mysql-data

networks:
  clf-net:
    name: clf-net
