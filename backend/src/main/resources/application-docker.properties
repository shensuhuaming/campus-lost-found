spring.application.name=campus-lost-found
server.port=8080

# 容器内通过服务名 mysql 访问，端口是容器内的 3306（宿主映射到 3307）
# 密码等敏感项由 docker-compose 的环境变量注入，禁止写死在这里
spring.datasource.url=jdbc:mysql://mysql:3306/lost_found?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clf}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

admin.init-password=${ADMIN_INIT_PASSWORD:Admin@123}

jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-0123456789}
jwt.expire-hours=12
mybatis-plus.configuration.map-underscore-to-camel-case=true

logging.level.root=INFO
