# ===== 服务端口 =====
server.port=8080

# ===== 应用标识（健康检查会返回，方便确认部署的是本项目）=====
spring.application.name=campus-lost-found

# ===== 编码 =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===== 数据库 =====
# 默认面向「本机开发 + Docker 只起 MySQL（3307）」；容器内由环境变量覆盖为 mysql:3306
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/campus_lost_found?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clf}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== 上传限制（FR-05：最多 3 张、单张 ≤2MB；请求体按 3 张 + 表单余量放宽）=====
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=8MB

# ===== Actuator：仅暴露 health，供 docker healthcheck =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ===== 日志 =====
logging.level.root=INFO
logging.level.com.campus.lostfound=DEBUG
