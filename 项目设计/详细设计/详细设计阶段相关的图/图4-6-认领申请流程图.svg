<text x="400.0" y="404.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">非本人发布？</text>
<polygon points="30,378.0 221,378.0 207,430.0 16,430.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="118.5" y="404.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">提示“不能认领自己发布的信息”</text>
<polygon points="400.0,476 565.0,520.0 400.0,564 235.0,520.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="520.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">物品状态为进行中或处理中？</text>
<polygon points="30,494.0 206,494.0 192,546.0 16,546.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="111.0" y="520.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">提示“该物品当前不可认领”</text>
<polygon points="400.0,594 565.0,636.0 400.0,678 235.0,636.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="636.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">本人未提交过认领？</text>
<polygon points="30,610.0 206,610.0 192,662.0 16,662.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="111.0" y="636.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">提示“您已提交过认领申请”</text>
<rect x="235.0" y="708" width="330" height="62" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="730.4200000000001" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">插入 claim：status = 0（待核验）、</text>
<text x="400.0" y="747.58" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">detail_desc 不超过 300 字</text>
<rect x="235.0" y="800" width="330" height="56" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="828.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">若物品为进行中，更新 item_status = 1（处理中）</text>
<rect x="235.0" y="886" width="330" height="54" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="913.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">推送认领申请消息给发布者（type = 3）</text>
<polygon points="249.0,970 565.0,970 551.0,1020 235.0,1020" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
