<text x="400.0" y="110.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">校验登录状态，读取 itemId 与认领说明</text>
<rect x="235.0" y="166" width="330" height="52" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">查询失物详情 selectById(itemId)</text>
<polygon points="400.0,248 565.0,290.0 400.0,332 235.0,290.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="290.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">失物存在且已审核通过？</text>
<polygon points="30,261.0 206,261.0 192,319.0 16,319.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="111.0" y="282.08000000000004" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">提示“该信息不存在</text>
<text x="111.0" y="297.92" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">或未通过审核”</text>
