<text x="400.0" y="188.42000000000002" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">填写失物信息表单：类型、标题、分类、时间、</text>
<text x="400.0" y="205.58" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">地点、描述、联系方式</text>
<rect x="235.0" y="260" width="330" height="56" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="288.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">上传图片 0~3 张（jpg/png，单张不超过 2MB）</text>
<polygon points="400.0,346 565.0,388.0 400.0,430 235.0,388.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="388.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">前端校验通过？</text>
<polygon points="30,359.0 206,359.0 192,417.0 16,417.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="111.0" y="380.08000000000004" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">提示字段超长或必填项为空</text>
<text x="111.0" y="395.92" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">并阻止提交</text>
<rect x="235.0" y="460" width="330" height="54" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="487.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">提交 POST /api/items（含 imageUrls）</text>
<rect x="235.0" y="544" width="330" height="58" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="573.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">后端校验：字段长度、分类存在性、登录用户一致</text>
<polygon points="400.0,632 565.0,674.0 400.0,716 235.0,674.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="674.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">校验通过？</text>
<polygon points="30,648.0 206,648.0 192,700.0 16,700.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="111.0" y="674.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">返回 400 与具体字段错误信息</text>
<rect x="235.0" y="746" width="330" height="64" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="769.4200000000001" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">保存 lost_item：audit_status = 0（待审核）、</text>
<text x="400.0" y="786.58" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">item_status = 0（进行中）</text>
<rect x="235.0" y="840" width="330" height="52" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="866.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">按 sort 保存 item_image 记录</text>
<polygon points="249.0,922 565.0,922 551.0,972 235.0,972" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="947.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">返回“已提交，等待审核”</text>
<rect x="235.0" y="1002" width="330" height="38" rx="19.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="1021.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">结束</text>
