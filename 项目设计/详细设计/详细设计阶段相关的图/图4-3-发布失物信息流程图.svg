<svg xmlns="http://www.w3.org/2000/svg" width="573px" height="1048px" viewBox="0 0 573 1048">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect width="573" height="1048" fill="#ffffff"/>
<rect x="235.0" y="16" width="330" height="38" rx="19.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="35.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">开始</text>
