<text x="1393.0" y="556" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">8. INSERT item_image × N（按</text>
<text x="1393.0" y="570" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central"> sort 排序）</text>
