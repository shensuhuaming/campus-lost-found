<rect x="1389.0" y="477" width="194.0" height="32" fill="#ffffff"/>
<text x="1393.0" y="486" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">7. 校验分类后 INSERT lost_item</text>
