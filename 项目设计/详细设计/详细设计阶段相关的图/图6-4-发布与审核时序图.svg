<rect x="1139.0" y="631" width="96.25" height="18" fill="#ffffff"/>
<text x="1143.0" y="640" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">9. 返回 itemId</text>
<path d="M 1135.0,710 L 385.0,710" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<rect x="389.0" y="672" width="134.2" height="32" fill="#ffffff"/>
<text x="393.0" y="681" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">10. 返回 {code:200, </text>
<text x="393.0" y="695" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">data:{id}}</text>
<path d="M 385.0,780 L 135.0,780" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<rect x="139.0" y="756" width="161.79999999999998" height="18" fill="#ffffff"/>
<text x="143.0" y="765" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">11. 提示发布成功，等待审核</text>
<path d="M 1885.0,835 L 2135.0,835" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="1889.0" y="797" width="160.65" height="32" fill="#ffffff"/>
<text x="1893.0" y="806" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">12. 打开待审列表（GET </text>
<text x="1893.0" y="820" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">/api/admin/items/audit）</text>
<path d="M 1885.0,905 L 2135.0,905" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="1889.0" y="867" width="192.275" height="32" fill="#ffffff"/>
<text x="1893.0" y="876" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">13. 审核通过（PUT </text>
<text x="1893.0" y="890" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">/api/admin/items/{id}/audit）</text>
<path d="M 2135.0,975 L 1635.0,975" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="1639.0" y="937" width="142.82500000000002" height="32" fill="#ffffff"/>
<text x="1643.0" y="946" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">14. UPDATE ... WHERE </text>
<text x="1643.0" y="960" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">audit_status=0</text>
<path d="M 2135.0,1045 L 1885.0,1045" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<rect x="1889.0" y="1007" width="187.1" height="32" fill="#ffffff"/>
<text x="1893.0" y="1016" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">15. 返回 200（消息在事务提交后</text>
<text x="1893.0" y="1030" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">推送）</text>
<rect x="40" y="1141" width="460" height="56" rx="4" fill="#FFFFFF" stroke="#666666" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="48" y="1154.0" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">图片三重校验（评审 P0-5）：</text>
<text x="48" y="1168.0" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">　① 白名单正则 /uploads/yyyyMM/&lt;32 位十六进制&gt;.jpg|png</text>
<text x="48" y="1182.0" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">　② 文件必须真实存在；③ 未被其他信息引用</text>
<rect x="490" y="1141" width="430" height="42" rx="4" fill="#FFFFFF" stroke="#666666" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="498" y="1154.0" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">上传：空 4001 / 超 2MB 4002 / 类型或文件头不符 4003。</text>
<text x="498" y="1168.0" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">审核：条件更新影响行数 ≠1 → 2003（重复审核或并发）。</text>
</svg>