<rect x="1139.0" y="436" width="98.55000000000001" height="18" fill="#ffffff"/>
<text x="1143.0" y="445" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">6. create(dto)</text>
