<rect x="389.0" y="172" width="129.02500000000003" height="32" fill="#ffffff"/>
<text x="393.0" y="181" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">2. 逐张上传（POST </text>
<text x="393.0" y="195" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">/api/upload/image）</text>
<path d="M 635.0,280 L 885.0,280" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="639.0" y="256" width="104.875" height="18" fill="#ffffff"/>
<text x="643.0" y="265" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">3. upload(file)</text>
<path d="M 885.0,335 L 385.0,335" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<rect x="389.0" y="297" width="191.12500000000003" height="32" fill="#ffffff"/>
<text x="393.0" y="306" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">4. 返回 /uploads/yyyyMM/&lt;uuid</text>
<text x="393.0" y="320" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">&gt;.png</text>
