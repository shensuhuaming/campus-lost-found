<svg xmlns="http://www.w3.org/2000/svg" width="553px" height="1034px" viewBox="0 0 553 1034">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect width="553" height="1034" fill="#ffffff"/>
<rect x="235.0" y="16" width="310" height="38" rx="19.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="390.0" y="35.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">开始</text>
<polygon points="249.0,84 545.0,84 531.0,148 235.0,148" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="390.0" y="116.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">输入学号、昵称、手机号、密码、确认密码</text>
<rect x="235.0" y="178" width="310" height="68" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="390.0" y="203.42000000000002" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">前端校验：学号 6~12 位数字、密码不少于 6 位</text>
<text x="390.0" y="220.58" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">两次密码一致、手机 11 位</text>
<polygon points="390.0,276 545.0,320.0 390.0,364 235.0,320.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="390.0" y="320.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">校验通过？</text>
<polygon points="30,291.0 206,291.0 192,349.0 16,349.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="111.0" y="312.08000000000004" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">提示“输入不合法”</text>
<text x="111.0" y="327.92" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">并高亮错误字段</text>
