<text x="390.0" y="417.41999999999996" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">查询学号是否已注册</text>
<text x="390.0" y="434.58" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">selectByStudentNo(studentNo)</text>
<polygon points="390.0,488 545.0,532.0 390.0,576 235.0,532.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="390.0" y="532.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">学号已存在？</text>
<polygon points="30,503.0 206,503.0 192,561.0 16,561.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="111.0" y="524.0799999999999" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">提示“该学号已注册”</text>
<text x="111.0" y="539.92" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">并自动跳转登录</text>
<rect x="235.0" y="606" width="310" height="60" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="390.0" y="627.4200000000001" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">BCrypt 加密密码</text>
<text x="390.0" y="644.58" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">password = BCrypt.hash(明文)</text>
<rect x="235.0" y="696" width="310" height="60" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="390.0" y="717.4200000000001" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">插入用户记录</text>
<text x="390.0" y="734.58" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">role = 0（学生）、status = 0（正常）</text>
<polygon points="390.0,786 545.0,830.0 390.0,874 235.0,830.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<text x="390.0" y="830.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="13" fill="#000000" dominant-baseline="central">插入成功？</text>
