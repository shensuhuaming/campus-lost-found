<text x="111.0" y="822.0799999999999" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">提示“注册失败”</text>
<text x="111.0" y="837.92" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="12" fill="#000000" dominant-baseline="central">并提示稍后重试</text>
