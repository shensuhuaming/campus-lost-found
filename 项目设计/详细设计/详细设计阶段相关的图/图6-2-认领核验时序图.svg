<text x="322.5" y="44.93000000000001" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">（ClaimController）</text>
<rect x="460" y="16" width="175" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="547.5" y1="60" x2="547.5" y2="706" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="547.5" y="31.07" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">认领服务</text>
<text x="547.5" y="44.93000000000001" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">（ClaimService）</text>
<rect x="685" y="16" width="185" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="777.5" y1="60" x2="777.5" y2="706" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="777.5" y="31.07" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">物品状态机</text>
<text x="777.5" y="44.93000000000001" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">（ItemStatusMachine）</text>
<rect x="910" y="16" width="190" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="1005.0" y1="60" x2="1005.0" y2="706" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1005.0" y="31.07" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">认领与失物数据访问</text>
<text x="1005.0" y="44.93000000000001" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">（ClaimMapper / ItemMapper）</text>
<rect x="1150" y="16" width="180" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="1240.0" y1="60" x2="1240.0" y2="706" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1240.0" y="31.07" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">数据库</text>
<text x="1240.0" y="44.93000000000001" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">（MySQL 8）</text>
<rect x="40" y="700" width="700" height="66" rx="4" fill="#FFFFFF" stroke="#666666" stroke-width="1.2"/>
<text x="46" y="717.82" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">事务边界：@Transactional 覆盖第 3~13 步；条件更新影响行数为 0 时</text>
<text x="46" y="733.0" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">抛“状态不允许”业务异常并回滚全部写操作。核验拒绝走 reject 分支：</text>
<text x="46" y="748.1800000000001" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">claim.status = 2、物品 item_status 由 1 退回 0，并推送认领结果消息。</text>
<path d="M 726,700 L 726,714 L 740,714" fill="none" stroke="#333333" stroke-width="1.1"/>
<path d="M 726,700 L 740,714" fill="none" stroke="#333333" stroke-width="1.1"/>
<rect x="316.5" y="140" width="12" height="520" fill="#F0F0F0" stroke="#333333" stroke-width="1.0"/>
<rect x="541.5" y="182" width="12" height="428" fill="#F0F0F0" stroke="#333333" stroke-width="1.0"/>
<rect x="999.0" y="226" width="12" height="294" fill="#F0F0F0" stroke="#333333" stroke-width="1.0"/>
<path d="M 97.5,120 L 322.5,120" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="-18.25" y="100" width="456.5" height="17" fill="#ffffff"/>
<text x="210.0" y="107.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">1. 提交核验请求（PUT /api/claims/{id}/approve）</text>
<path d="M 322.5,162 L 547.5,162" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="327.5" y="142" width="215.0" height="17" fill="#ffffff"/>
<text x="435.0" y="149.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">2. 调用核验通过（approve）</text>
<path d="M 547.5,204 L 1005.0,204" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="651.5" y="184" width="249.5" height="17" fill="#ffffff"/>
<text x="776.25" y="191.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">3. 查询认领记录（selectById）</text>
<path d="M 1005.0,246 L 1240.0,246" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="882.75" y="226" width="479.5" height="17" fill="#ffffff"/>
<text x="1122.5" y="233.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">4. 执行查询（SELECT * FROM claim WHERE id = ?）</text>
<path d="M 1240.0,288 L 1005.0,288" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="974.75" y="268" width="295.5" height="17" fill="#ffffff"/>
<text x="1122.5" y="275.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">5. 返回认领记录（status = 0 待核验）</text>
<path d="M 1005.0,330 L 547.5,330" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="680.25" y="310" width="192.0" height="17" fill="#ffffff"/>
<text x="776.25" y="317.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">6. 返回认领对象（Claim）</text>
<path d="M 547.5,382 L 777.5,382" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="526.25" y="362" width="272.5" height="17" fill="#ffffff"/>
<text x="662.5" y="369.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">7. 状态机校验（1 处理中 → 2 已完成）</text>
<path d="M 547.5,424 L 1005.0,424" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="617.0" y="404" width="318.5" height="17" fill="#ffffff"/>
<text x="776.25" y="411.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">8. 条件更新物品状态（updateStatusIf）</text>
<path d="M 1005.0,466 L 1240.0,466" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="865.5" y="431" width="514.0" height="32" fill="#ffffff"/>
<text x="1122.5" y="438.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">9. 执行更新（UPDATE lost_item SET item_status = 2</text>
<text x="1122.5" y="453.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">WHERE id = ? AND item_status = 1）</text>
<path d="M 1240.0,508 L 1005.0,508" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="997.75" y="488" width="249.5" height="17" fill="#ffffff"/>
<text x="1122.5" y="495.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">10. 影响行数 = 1（为 0 则回滚）</text>
<path d="M 547.5,550 L 1005.0,550" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="628.5" y="530" width="295.5" height="17" fill="#ffffff"/>
<text x="776.25" y="537.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">11. 更新认领记录（updateApprove）</text>
<path d="M 1005.0,592 L 1240.0,592" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="762.0" y="572" width="721.0" height="17" fill="#ffffff"/>
<text x="1122.5" y="579.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">12. 执行更新（UPDATE claim SET status = 1, reply = ?, admin_id = ?）</text>
<path d="M 547.5,634 L 322.5,634" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="321.75" y="614" width="226.5" height="17" fill="#ffffff"/>
<text x="435.0" y="621.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">13. 返回成功（Result.ok）</text>
<path d="M 322.5,676 L 97.5,676" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="22.0" y="656" width="376.0" height="17" fill="#ffffff"/>
<text x="210.0" y="663.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">14. 响应（code=200, message="核验成功"）</text>
</svg>