<text x="885.0" y="49.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11" fill="#000000" dominant-baseline="central">（CommentService）</text>
<line x1="885.0" y1="64" x2="885.0" y2="1095" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="1040.0" y="20" width="190" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
