<path d="M 885.0,390 L 1135.0,390" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="889.0" y="352" width="154.9" height="32" fill="#ffffff"/>
<text x="893.0" y="361" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">5. 按分类聚合（GROUP BY </text>
<text x="893.0" y="375" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">category_id）</text>
<path d="M 885.0,460 L 1135.0,460" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="889.0" y="422" width="175.025" height="32" fill="#ffffff"/>
<text x="893.0" y="431" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">6. 按天聚合（GROUP BY DATE(</text>
<text x="893.0" y="445" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">created_at)）</text>
