<text x="48" y="889.0" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">权限：先 requireAdmin()，非管理员返回 2002。</text>
<text x="48" y="903.0" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">归还率 = 已完成拾物 ÷ 已过审拾物。</text>
<text x="48" y="917.0" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">趋势默认 30 天（7~30 可调），无数据的日期补 0。</text>
