<text x="143.0" y="751" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">11. 渲染指标卡与 ECharts 饼图 </text>
<text x="143.0" y="765" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">/ 折线图</text>
