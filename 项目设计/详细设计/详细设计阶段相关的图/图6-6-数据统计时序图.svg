<rect x="889.0" y="282" width="189.975" height="32" fill="#ffffff"/>
<text x="893.0" y="291" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">4. 统计总数、待审核、已完成认领</text>
