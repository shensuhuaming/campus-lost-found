<svg xmlns="http://www.w3.org/2000/svg" width="1178px" height="668px" viewBox="0 0 1178 668">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect width="1178" height="668" fill="#ffffff"/>
<rect x="20" y="20" width="170" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="105.0" y1="64" x2="105.0" y2="660" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="105.0" y="42.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">用户／浏览器</text>
<rect x="220" y="20" width="170" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="305.0" y1="64" x2="305.0" y2="660" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="305.0" y="42.0" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">前端页面（Vue）</text>
<rect x="420" y="20" width="170" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="505.0" y1="64" x2="505.0" y2="660" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="505.0" y="34.739999999999995" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">认证控制器</text>
<text x="505.0" y="49.26" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">（AuthController）</text>
<rect x="620" y="20" width="170" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="705.0" y1="64" x2="705.0" y2="660" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="705.0" y="34.739999999999995" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">认证服务</text>
<text x="705.0" y="49.26" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">（AuthService）</text>
<rect x="820" y="20" width="160" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="900.0" y1="64" x2="900.0" y2="660" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="900.0" y="34.739999999999995" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">用户数据访问</text>
<text x="900.0" y="49.26" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">（UserMapper）</text>
<rect x="1000" y="20" width="170" height="44" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
<line x1="1085.0" y1="64" x2="1085.0" y2="660" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1085.0" y="34.739999999999995" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">数据库</text>
<text x="1085.0" y="49.26" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.0" fill="#000000" dominant-baseline="central">（MySQL 8）</text>
<rect x="26" y="462" width="396" height="104" rx="4" fill="#FFFFFF" stroke="#666666" stroke-width="1.2"/>
<text x="32" y="493.21" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">8. 校验：用户存在、状态正常</text>
<text x="32" y="507.07" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">　　→ 比对密码（BCrypt.matches）</text>
<text x="32" y="520.93" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">　　→ 通过则签发令牌（JWT）</text>
<text x="32" y="534.79" font-family="Microsoft YaHei,SimHei" font-size="10.5" fill="#000000" dominant-baseline="central">　　　（uid、role，有效期 12h）</text>
<rect x="499.0" y="190" width="12" height="420" fill="#F0F0F0" stroke="#333333" stroke-width="1.0"/>
<rect x="699.0" y="236" width="12" height="330" fill="#F0F0F0" stroke="#333333" stroke-width="1.0"/>
<rect x="894.0" y="282" width="12" height="188" fill="#F0F0F0" stroke="#333333" stroke-width="1.0"/>
<path d="M 105.0,150 L 305.0,150" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="114.75" y="130" width="180.5" height="17" fill="#ffffff"/>
<text x="205.0" y="137.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">1. 输入学号、密码，点击登录</text>
<path d="M 305.0,196 L 505.0,196" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="222.75" y="176" width="364.5" height="17" fill="#ffffff"/>
<text x="405.0" y="183.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">2. 提交登录请求（POST /api/auth/login）</text>
<path d="M 505.0,242 L 705.0,242" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="509.0" y="222" width="192.0" height="17" fill="#ffffff"/>
<text x="605.0" y="229.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">3. 调用登录方法（login）</text>
<path d="M 705.0,288 L 900.0,288" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="631.75" y="268" width="341.5" height="17" fill="#ffffff"/>
<text x="802.5" y="275.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">4. 按学号查询用户（selectByStudentNo）</text>
<path d="M 900.0,334 L 1085.0,334" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="712.5" y="314" width="560.0" height="17" fill="#ffffff"/>
<text x="992.5" y="321.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">5. 执行查询（SELECT * FROM user WHERE student_no = ?）</text>
<path d="M 1085.0,380 L 900.0,380" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="879.25" y="360" width="226.5" height="17" fill="#ffffff"/>
<text x="992.5" y="367.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">6. 返回用户记录（无则为 null）</text>
<path d="M 900.0,426 L 705.0,426" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="689.25" y="406" width="226.5" height="17" fill="#ffffff"/>
<text x="802.5" y="413.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">7. 返回用户对象（无则为 null）</text>
<path d="M 705.0,560 L 505.0,560" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="491.75" y="540" width="226.5" height="17" fill="#ffffff"/>
<text x="605.0" y="547.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">9. 返回令牌与用户信息（token）</text>
<path d="M 505.0,606 L 305.0,606" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="159.5" y="586" width="491.0" height="17" fill="#ffffff"/>
<text x="405.0" y="593.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">10. 返回统一响应（Result{code:200, data:{token}}）</text>
<path d="M 305.0,652 L 105.0,652" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<rect x="126.25" y="632" width="157.5" height="17" fill="#ffffff"/>
<text x="205.0" y="639.5" text-anchor="middle" font-family="Microsoft YaHei,SimHei" font-size="11.5" fill="#000000" dominant-baseline="central">11. 存储令牌，跳转首页</text>
</svg>